            <!-- actividad / programación del día (solo se muestra si hay incidencia que bloquea) -->
            <div id="programacionHoy"></div>

        </div>


        <!-- UBICACION -->

        <div class="estadoGPS">

            <svg class="iconoGPS" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path>
                <circle cx="12" cy="10" r="2.5"></circle>
            </svg>
            Ubicación

            <span id="gps">

                Esperando...

            </span>

        </div>


        <!-- BOTONES -->

        <div class="botones">

            <button
                class="btnIngreso"
                onclick="registrar('Ingreso')">

                REGISTRAR INGRESO

            </button>


            <button
                class="btnSalida"
                onclick="registrar('Salida')">

                REGISTRAR SALIDA

            </button>

        </div>


        <!-- MENSAJES -->

        <div id="mensaje"></div>

    </div>

</div>
<!-- TARJETA/OVERLAY DE CONFIRMACIÓN -->
<div class="overlayExito" id="overlayExito">
    <div class="tarjetaExito" id="tarjetaExito">
        <div class="circuloCheck" id="circuloCheckExito">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <div class="tituloTarjetaExito" id="tituloTarjetaExito">¡Registrado!</div>
        <div class="cuerpoTarjetaExito" id="cuerpoTarjetaExito"></div>
        <button class="btnCerrarTarjeta" onclick="cerrarTarjetaExito()">Aceptar</button>
    </div>
</div>
<script src="config.js"></script>
<script src="script.js"></script>

</body>

</html>
